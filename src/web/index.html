<title>Ask your PDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-pill: 999px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
            Inter, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);

    --bg: #0a0c11; --bg-2: #12151d; --bg-3: #1b1f2a; --bg-hover: #232837;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --text: #edeef2; --text-muted: #8b93a3; --text-faint: #5b6270;
    --accent: #7C9EF5; --accent-2: #B18CF5;
    --accent-weak: rgba(124,158,245,.14); --accent-weak-2: rgba(177,140,245,.14);
    --success: #3ddc84; --danger: #ff6b6b; --danger-weak: rgba(255,107,107,.12);
    --shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #f7f8fb; --bg-2: #ffffff; --bg-3: #f0f2f6; --bg-hover: #e8ebf1;
    --border: rgba(15,23,42,.08); --border-strong: rgba(15,23,42,.16);
    --text: #14161c; --text-muted: #666e7d; --text-faint: #9aa1ad;
    --accent: #4A6FE0; --accent-2: #8352E0;
    --accent-weak: rgba(74,111,224,.09); --accent-weak-2: rgba(131,82,224,.09);
    --success: #17a05a; --danger: #e5484d; --danger-weak: rgba(229,72,77,.08);
    --shadow: 0 8px 30px rgba(20,22,28,.08);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f8fb; --bg-2: #ffffff; --bg-3: #f0f2f6; --bg-hover: #e8ebf1;
      --border: rgba(15,23,42,.08); --border-strong: rgba(15,23,42,.16);
      --text: #14161c; --text-muted: #666e7d; --text-faint: #9aa1ad;
      --accent: #4A6FE0; --accent-2: #8352E0;
      --accent-weak: rgba(74,111,224,.09); --accent-weak-2: rgba(131,82,224,.09);
      --success: #17a05a; --danger: #e5484d; --danger-weak: rgba(229,72,77,.08);
      --shadow: 0 8px 30px rgba(20,22,28,.08);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; transition: background .25s var(--ease), color .25s var(--ease);
  }
  ::selection { background: var(--accent-weak); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 2px solid var(--bg); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  .app { display: grid; grid-template-columns: 272px 1fr; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--bg-2); border-right: 1px solid var(--border);
    padding: 1.1rem 1.1rem 1.4rem; display: flex; flex-direction: column; gap: 1.4rem;
  }
  .brand { display: flex; align-items: center; gap: .55rem; padding: .2rem .1rem .3rem; }
  .brand-icon { width: 30px; height: 30px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; flex: none;
    box-shadow: 0 2px 10px var(--accent-weak); }
  .brand-icon svg { width: 16px; height: 16px; color: #fff; }
  .brand-name { font-weight: 650; font-size: .96rem; letter-spacing: -.01em; flex: 1; }

  .icon-btn {
    width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-3); color: var(--text-muted); display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: all .15s var(--ease); flex: none;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }
  .icon-btn svg { width: 15px; height: 15px; }

  .side-section h2 {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-faint); margin: 0 0 .55rem; font-weight: 650;
  }

  .dropzone {
    display: flex; flex-direction: column; align-items: center; gap: .5rem;
    text-align: center; padding: 1.1rem .8rem; border-radius: var(--radius-md);
    border: 1.5px dashed var(--border-strong); background: var(--bg-3);
    cursor: pointer; transition: all .18s var(--ease); color: var(--text-muted); font-size: .82rem;
  }
  .dropzone:hover { border-color: var(--accent); background: var(--accent-weak); color: var(--text); }
  .dropzone.drag { border-color: var(--accent); background: var(--accent-weak); color: var(--text);
    transform: scale(1.01); }
  .dropzone svg { width: 20px; height: 20px; color: var(--accent); }
  .dropzone u { text-decoration: underline; text-underline-offset: 2px; color: var(--accent); }
  .dropzone .fname { font-weight: 600; color: var(--text); word-break: break-word; }

  .status-pill {
    display: inline-flex; align-items: center; gap: .5rem; font-size: .84rem;
    padding: .4rem .7rem; border-radius: var(--radius-pill); background: var(--bg-3);
    border: 1px solid var(--border); width: fit-content;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .dot.ok { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 20%, transparent); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 20%, transparent); }

  .config {
    font-family: var(--mono); font-size: .72rem; background: var(--bg-3);
    border: none; border-top: 1px solid var(--border); border-radius: 0;
    padding: .7rem .8rem; white-space: pre-wrap; color: var(--text-muted);
    line-height: 1.6; margin: 0;
  }

  /* Collapsed by default - a full model/chunking dump isn't something you
     need to see every time, only when you want to check what a result was
     produced with. Same <details>/<summary> pattern as .sources below. */
  .config-details { border: 1px solid var(--border); border-radius: var(--radius-md);
    overflow: hidden; background: var(--bg-3); }
  .config-details summary {
    cursor: pointer; padding: .55rem .75rem; font-size: .7rem; font-weight: 650;
    text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint);
    display: flex; align-items: center; gap: .45rem; list-style: none; user-select: none;
    transition: background .15s var(--ease);
  }
  .config-details summary::-webkit-details-marker { display: none; }
  .config-details summary:hover { background: var(--bg-hover); color: var(--text); }
  .config-details summary svg { width: 13px; height: 13px; flex: none; }
  .config-details summary::after { content: "›"; margin-left: auto; font-size: .95rem;
    transition: transform .18s var(--ease); }
  .config-details[open] summary::after { transform: rotate(90deg); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
    padding: .55rem .9rem; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--bg-3); color: var(--text); font-size: .84rem; font-weight: 560;
    cursor: pointer; transition: all .15s var(--ease); font-family: inherit;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .btn svg { width: 14px; height: 14px; }
  .btn.ghost { background: transparent; color: var(--text-muted); }
  .btn.ghost:hover { background: var(--bg-3); color: var(--text); }

  .hint { font-size: .75rem; color: var(--text-faint); line-height: 1.5; margin: 0 0 0 auto; }

  /* ---------- Web fallback toggle ---------- */
  .toggle-row { display: flex; align-items: center; justify-content: space-between;
    gap: .6rem; cursor: pointer; }
  .toggle-row.disabled { cursor: not-allowed; opacity: .5; }
  .toggle-label { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: var(--text); }
  .toggle-label svg { width: 14px; height: 14px; color: var(--text-muted); flex: none; }
  .switch { position: relative; width: 34px; height: 19px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch input:disabled { cursor: not-allowed; }
  .switch-track { position: absolute; inset: 0; background: var(--bg-3);
    border: 1px solid var(--border-strong); border-radius: 999px; transition: background .15s var(--ease); }
  .switch-thumb { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: var(--text-faint); transition: transform .15s var(--ease), background .15s var(--ease); }
  .switch input:checked ~ .switch-track { background: var(--accent-weak); border-color: var(--accent); }
  .switch input:checked ~ .switch-track .switch-thumb { transform: translateX(15px); background: var(--accent); }

  /* ---------- Main / thread ---------- */
  .main { display: flex; flex-direction: column; min-height: 100vh; position: relative; }
  .thread { flex: 1; max-width: 780px; width: 100%; margin: 0 auto; padding: 2.2rem 1.6rem 7.5rem; }

  .empty-state { text-align: center; padding: 3.5rem 1rem 2rem; animation: rise .5s var(--ease); }
  .empty-icon {
    width: 56px; height: 56px; margin: 0 auto 1.1rem; border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--accent-weak), var(--accent-weak-2));
    display: flex; align-items: center; justify-content: center;
  }
  .empty-icon svg { width: 26px; height: 26px; color: var(--accent); }
  .empty-state h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
  .empty-state p { color: var(--text-muted); font-size: .92rem; max-width: 440px; margin: 0 auto; line-height: 1.55; }

  .doc-bar {
    display: flex; align-items: center; gap: .6rem; padding: .65rem 1rem;
    border-radius: var(--radius-md); background: var(--bg-2);
    border: 1px solid var(--border); font-size: .86rem; margin-bottom: 1.6rem;
    animation: rise .35s var(--ease);
  }
  .doc-bar svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
  .doc-bar .name { font-weight: 620; }
  .doc-bar .meta { color: var(--text-muted); }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  #messages { display: flex; flex-direction: column; gap: 1.4rem; }
  .msg { display: flex; gap: .7rem; align-items: flex-start; animation: rise .3s var(--ease); }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; margin-top: .1rem;
  }
  .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .msg.assistant .avatar svg { width: 14px; height: 14px; color: #fff; }
  .msg.user .avatar { background: var(--bg-3); border: 1px solid var(--border); }
  .msg.user .avatar svg { width: 13px; height: 13px; color: var(--text-muted); }

  .msg-body { max-width: 82%; display: flex; flex-direction: column; gap: .4rem; }
  .msg.user .msg-body { align-items: flex-end; }
  .bubble { padding: .68rem .95rem; border-radius: var(--radius-md); line-height: 1.6;
            white-space: pre-wrap; font-size: .93rem; word-wrap: break-word; }
  .msg.user .bubble { background: var(--accent-weak); border: 1px solid transparent; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bg-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  /* ---------- "Searching" robot, replaces a plain dots spinner ---------- */
  .bot-loader { display: flex; align-items: center; gap: .7rem; padding: .4rem 0 .3rem; }
  .bot-3d { perspective: 220px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bot-head {
    position: relative; width: 32px; height: 24px; border-radius: 8px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 8px var(--accent-weak), inset 0 -3px 5px rgba(0,0,0,.18),
                inset 0 2px 3px rgba(255,255,255,.3);
    animation: botHead 2.6s ease-in-out infinite;
  }
  .bot-eye {
    position: absolute; top: 9px; width: 5px; height: 5px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 4px rgba(255,255,255,.9);
    animation: botEyes 2.6s ease-in-out infinite;
  }
  .bot-eye.l { left: 7px; } .bot-eye.r { left: 18px; }
  .bot-antenna { position: relative; width: 2px; height: 7px; background: var(--border-strong); border-radius: 1px; }
  .bot-antenna-dot {
    position: absolute; top: -5px; left: -2px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2); box-shadow: 0 0 6px var(--accent-2);
    animation: botPulse 1.1s ease-in-out infinite;
  }
  .bot-shadow { width: 20px; height: 4px; border-radius: 50%; background: var(--border-strong);
    opacity: .35; filter: blur(1px); }
  .bot-loader-text { font-size: .82rem; color: var(--text-faint); }

  /* One keyframe block per animated part, not two animations on the same
     element - CSS's "transform" property can't be driven by two separate
     `animation:` entries at once (the second silently wins), so the float,
     the head-turn, the eye-scan and the blink are each combined into a
     single sequence instead of layered. */
  @keyframes botHead {
    0%   { transform: translateY(0) rotateY(0deg); }
    25%  { transform: translateY(-2px) rotateY(-16deg); }
    50%  { transform: translateY(-3px) rotateY(0deg); }
    75%  { transform: translateY(-1px) rotateY(16deg); }
    100% { transform: translateY(0) rotateY(0deg); }
  }
  @keyframes botEyes {
    0%   { transform: translateX(0) scaleY(1); }
    20%  { transform: translateX(-2px) scaleY(1); }
    45%  { transform: translateX(-2px) scaleY(.15); }
    50%  { transform: translateX(0) scaleY(1); }
    70%  { transform: translateX(2px) scaleY(1); }
    100% { transform: translateX(0) scaleY(1); }
  }
  @keyframes botPulse {
    0%, 100% { opacity: .5; transform: scale(.85); }
    50%      { opacity: 1; transform: scale(1.2); }
  }

  /* ---------- Sidebar mascot - a persistent companion, not just a spinner.
     A full figure (antenna + head + body + arms), not a floating head alone
     - the whole .mascot-figure moves as ONE rigid unit (bob + head-turn),
     so the antenna, head and body stay visually attached to each other
     instead of animating independently and looking disconnected.
     Three states, each meaning something rather than just decorating:
       (default) idle   - calm, ambient, nothing is happening
       .busy             - a question is in flight, more alert motion
       .offline          - Ollama unreachable, dimmed and still, "asleep"
     Driven by JS from real state (see updateMascot()) - health polling and
     whether a request is currently streaming, not a fixed loop. ---------- */
  .mascot { position: relative; flex: 1; min-height: 110px; display: flex;
    align-items: center; justify-content: center; cursor: pointer; }

  .mascot-speech {
    position: absolute; bottom: calc(100% + 2px); left: 50%; z-index: 5;
    max-width: 190px; padding: .45rem .7rem; border-radius: 12px;
    background: var(--bg-3); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
    font-size: .78rem; color: var(--text); text-align: center; line-height: 1.35;
    opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(4px) scale(.85);
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .mascot-speech::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--bg-3);
  }
  .mascot-speech.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  /* One-off reaction animations, played by JS via a temporary inline
     `animation` (see playMascotAnim() in the script) rather than a CSS
     class - that lets a reaction interrupt whatever idle/busy loop is
     already running and then hand control back to it cleanly on
     `animationend`, instead of fighting the looping animation for
     specificity. */
  @keyframes mascotJump {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    30%  { transform: translateY(-16px) rotate(-10deg) scale(1.08); }
    55%  { transform: translateY(-16px) rotate(10deg) scale(1.08); }
    75%  { transform: translateY(2px) rotate(-3deg) scale(1); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }
  @keyframes mascotShrug {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(2px) rotate(-6deg); }
    60%      { transform: translateY(2px) rotate(6deg); }
  }
  @keyframes mascotWiggle {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-7deg); }
    75%      { transform: rotate(7deg); }
  }
  .mascot:hover .mascot-arm.r { animation: mascotWave .5s ease-in-out !important; }
  @keyframes mascotWave {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(-45deg); }
  }
  .mascot-3d { position: relative; perspective: 320px; display: flex;
    flex-direction: column; align-items: center; gap: 6px; }
  .mascot-figure {
    display: flex; flex-direction: column; align-items: center;
    animation: mascotIdle 3s ease-in-out infinite;
    transition: filter .5s var(--ease);
  }
  .mascot-antenna { position: relative; width: 3px; height: 11px; background: var(--border-strong); border-radius: 2px; }
  .mascot-antenna-dot {
    position: absolute; top: -6px; left: -3.5px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2);
    animation: mascotPulse 2.6s ease-in-out infinite;
  }
  .mascot-head {
    position: relative; width: 56px; height: 40px; border-radius: 14px; margin-top: 3px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 14px var(--accent-weak), inset 0 -5px 8px rgba(0,0,0,.18),
                inset 0 3px 5px rgba(255,255,255,.3);
  }
  .mascot-eye {
    position: absolute; top: 14px; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.9);
    animation: mascotBlink 4.6s ease-in-out infinite;
  }
  .mascot-eye.l { left: 12px; } .mascot-eye.r { left: 31px; }
  .mascot-mouth {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 13px; height: 5px; border-bottom: 2px solid rgba(255,255,255,.75); border-radius: 0 0 7px 7px;
    transition: all .3s var(--ease);
  }
  .mascot-neck { width: 12px; height: 4px; background: var(--border-strong); opacity: .55; }
  .mascot-body {
    position: relative; width: 48px; height: 34px; border-radius: 12px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 14px var(--accent-weak), inset 0 -4px 6px rgba(0,0,0,.18),
                inset 0 2px 4px rgba(255,255,255,.25);
  }
  .mascot-core {
    position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,.85); box-shadow: 0 0 8px rgba(255,255,255,.6);
    transform: translate(-50%, -50%);
    animation: mascotCore 2.4s ease-in-out infinite;
  }
  .mascot-arm {
    position: absolute; top: 4px; width: 6px; height: 17px; border-radius: 3px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: inset 0 2px 3px rgba(255,255,255,.25);
    transform-origin: top center;
  }
  .mascot-arm.l { right: 100%; margin-right: 1px; animation: mascotArmL 3.6s ease-in-out infinite; }
  .mascot-arm.r { left: 100%; margin-left: 1px; animation: mascotArmR 3.6s ease-in-out infinite; }
  .mascot-shadow { width: 38px; height: 6px; border-radius: 50%; background: var(--border-strong);
    opacity: .3; filter: blur(2px); }

  @keyframes mascotIdle {
    0%   { transform: translateY(0) rotateY(0deg); }
    20%  { transform: translateY(-5px) rotateY(-11deg); }
    50%  { transform: translateY(-9px) rotateY(0deg); }
    80%  { transform: translateY(-3px) rotateY(11deg); }
    100% { transform: translateY(0) rotateY(0deg); }
  }
  @keyframes mascotBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    96%           { transform: scaleY(.1); }
  }
  @keyframes mascotPulse {
    0%, 100% { opacity: .5; transform: scale(.85); }
    50%      { opacity: 1; transform: scale(1.15); }
  }
  @keyframes mascotCore {
    0%, 100% { opacity: .5; transform: translate(-50%,-50%) scale(.8); }
    50%      { opacity: 1;  transform: translate(-50%,-50%) scale(1.2); }
  }
  @keyframes mascotArmL { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-5deg); } }
  @keyframes mascotArmR { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(5deg); } }

  /* .busy reuses the loader's own faster head/eye keyframes (botHead /
     botEyes) at full mascot size, PLUS quicker everything else - "alert"
     is the same motion language as "searching", just embodied in the
     bigger, persistent figure instead of a transient inline one. */
  .mascot.busy .mascot-figure { animation: botHead 2.3s ease-in-out infinite; }
  .mascot.busy .mascot-eye { animation: botEyes 2.3s ease-in-out infinite; }
  .mascot.busy .mascot-antenna-dot { animation: mascotPulse 0.9s ease-in-out infinite; }
  .mascot.busy .mascot-core { animation: mascotCore 0.9s ease-in-out infinite; }
  .mascot.busy .mascot-arm.l { animation: mascotArmL 1s ease-in-out infinite; }
  .mascot.busy .mascot-arm.r { animation: mascotArmR 1s ease-in-out infinite; }
  .mascot.busy .mascot-mouth { width: 9px; border-radius: 50%; border-bottom: none;
    height: 6px; background: rgba(255,255,255,.75); } /* a small "o" - concentrating */

  .mascot.offline .mascot-figure,

<script>
const ICONS = {
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  docBig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',

  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 14 9 21 12 14 15 12 22 10 15 3 12 10 9Z"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>',
};

const $ = (id) => document.getElementById(id);
const state = {
  collection: null, filename: null, chunkCount: 0, messages: [],
  webFallback: false,
  // Drive the sidebar mascot from real state rather than a fixed loop -
  // see updateMascot(). online starts true so the mascot doesn't flash
  // "offline" for a frame before the first health check resolves.
  online: true, busy: false, healthChecked: false,
};

function updateMascot() {
  const el = $("mascot");
  if (!el) return;
  const mood = !state.online ? "offline" : state.busy ? "busy" : "";
  el.className = "mascot" + (mood ? " " + mood : "");
  el.title = !state.online ? "Ollama unreachable" : state.busy ? "Working on it…" : "Idle";
}

// -------------------------------------------------------- mascot: speech --
let speechTimer = null;
function say(text, duration = 3200) {
  const el = $("mascot-speech");
  if (!el) return;
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(speechTimer);
  speechTimer = setTimeout(() => el.classList.remove("show"), duration);
}

// --------------------------------------------------- mascot: one-off reactions
// Played via a TEMPORARY inline `animation`, not a CSS class - a class
// would have to out-specificity whatever idle/busy loop .mascot-figure is
// already running. An inline style always wins while present, and
// `animationend` clears it, handing control straight back to the looping
// class-driven animation with no visible seam.
function playMascotAnim(name, cssDuration) {
  const figure = document.querySelector(".mascot-figure");
  if (!figure) return;
  // A real CSS gotcha, not a hypothetical one: if this exact animation
  // value is already set (two jump() calls close together - click + idle
  // timer, say), reassigning the identical string is a no-op as far as the
  // browser is concerned and the animation does NOT restart. Clearing it
  // to "none" and forcing a synchronous reflow (reading offsetWidth) before
  // setting the real value guarantees every call actually (re)plays,
  // however soon after the last one it fires.
  figure.style.animation = "none";
  void figure.offsetWidth;
  figure.style.animation = `${name} ${cssDuration} cubic-bezier(.34,1.56,.64,1)`;
  figure.addEventListener("animationend", () => { figure.style.animation = ""; }, { once: true });
}
const jump = () => playMascotAnim("mascotJump", ".6s");
const shrug = () => playMascotAnim("mascotShrug", ".7s");
const wiggle = () => playMascotAnim("mascotWiggle", ".4s");

// Same substring heuristic as generate.py's looks_like_refusal() - kept in
// sync deliberately (both read the SYSTEM_PROMPT's one required refusal
// sentence) so the mascot's reaction agrees with what the server considers
// a refusal, not a separate opinion of its own.
const REFUSAL_MARKERS = ["does not contain", "not contain this information",
  "no information", "not mentioned", "cannot answer"];
const looksLikeRefusal = (text) => REFUSAL_MARKERS.some((m) => text.toLowerCase().includes(m));

const GREETINGS = ["Hi there.", "What can I help with?", "Ready when you are.",
  "Need something?", "I'm listening.", "What's up?"];
const IDLE_LINES = ["Here if you need me.", "Take your time.", "Still here.",
  "Whenever you're ready.", "Just waiting."];

$("mascot").addEventListener("click", () => {
  (Math.random() < 0.75 ? jump : wiggle)();
  say(GREETINGS[Math.floor(Math.random() * GREETINGS.length)]);
});

// Two separate timers, deliberately - movement and speech shouldn't be
// coupled to the same rare roll, or the figure looks frozen for long
// stretches between them. Both still respect state.online / state.busy so
// neither fights the offline "asleep" look or the busy "searching" one.

// Frequent ambient movement - a jump or wiggle every few seconds, high
// probability. This is the actual "feels alive" signal; the idle bob alone
// (mascotIdle, always running) reads as breathing, not as doing something.
setInterval(() => {
  if (state.online && !state.busy && Math.random() < 0.7) {
    (Math.random() < 0.5 ? jump : wiggle)();
  }
}, 6000);

// Rarer speech on top of that movement - a quiet aside, not a running
// commentary, so it still reads as a personality quirk rather than nagging.
setInterval(() => {
  if (state.online && !state.busy && Math.random() < 0.4) {
    say(IDLE_LINES[Math.floor(Math.random() * IDLE_LINES.length)], 2400);
  }
}, 22000);

// ---------------------------------------------------------------- theme ---
function applyTheme(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  $("theme-toggle").innerHTML = mode === "dark" ? ICONS.sun : ICONS.moon;
  localStorage.setItem("theme", mode);
}
(function initTheme() {
  const saved = localStorage.getItem("theme");
  const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved || system);
})();
$("theme-toggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
});

// ---------------------------------------------------------- static icons --
$("brand-icon").innerHTML = ICONS.doc;
$("dropzone-icon").innerHTML = ICONS.upload;
$("empty-icon").innerHTML = ICONS.docBig;
$("send").innerHTML = ICONS.send;
$("clear").innerHTML = ICONS.trash + "<span>Clear conversation</span>";
$("web-toggle-icon").innerHTML = ICONS.globe;
$("config-icon").innerHTML = ICONS.settings;

// --------------------------------------------------------------- health ---
async function refreshHealth() {
  try {
    const r = await fetch("/api/health");
    const data = await r.json();
    $("dot").className = "dot " + (data.ollama ? "ok" : "bad");
    $("status-text").textContent = data.ollama ? "Ollama running" : "Ollama unreachable";
    $("config").textContent =
      `embedding  ${data.config.embed_model}\n` +
      `generation ${data.config.chat_model}\n` +
      `chunk size ${data.config.chunk_size} words\n` +
      `overlap    ${data.config.chunk_overlap} words\n` +
      `top-k      ${data.config.top_k}\n` +
      `headers    ${data.config.headers ? "on" : "off"}` +
      (data.config.headers
        ? ` (${data.config.headers_include_filename ? "with" : "no"} filename)`
        : "") +
      `\nweb search ${data.config.web_search_backend}`;

    // web_fallback_available is always true today (DuckDuckGo needs no
    // credentials) - the disabled/enabled branching is kept so a future
    // backend swap that DOES need configuration doesn't require touching
    // this file again, only websearch.is_configured().
    const toggle = $("web-toggle");
    const row = $("web-toggle-row");
    if (data.web_fallback_available) {
      toggle.disabled = false;
      row.classList.remove("disabled");
    } else {
      toggle.disabled = true;
      toggle.checked = false;
      state.webFallback = false;
      row.classList.add("disabled");
    }
    applyOnlineState(data.ollama);
    return data.ollama;
  } catch (e) {
    $("dot").className = "dot bad";
    $("status-text").textContent = "Server unreachable";
    applyOnlineState(false);
    return false;
  }
}

// Reacts to a CHANGE in reachability, not the level itself - refreshHealth
// polls every 30s, and re-announcing "I'm back!" on every single poll while
// already online would be noise, not personality. Skips the very first
// check entirely (state.healthChecked) so the mascot doesn't blurt out a
// reconnection line before it has ever said hello.
function applyOnlineState(online) {
  const was = state.online;
  state.online = online;
  if (state.healthChecked && was !== online) {
    if (online) { say("Back and connected."); jump(); }
    else { say("Lost connection to Ollama."); }
  }
  state.healthChecked = true;
  updateMascot();
}

$("web-toggle").addEventListener("change", (e) => {
  state.webFallback = e.target.checked;
});

// ------------------------------------------------------------- doc bar ----
function renderDocBar() {
  const bar = $("doc-bar");
  if (!state.collection) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  bar.innerHTML =
    ICONS.doc +
    `<span class="name">${state.filename}</span>` +
    `<span class="meta">· ${state.chunkCount} chunks` +
    `${state.wasCached ? " · loaded from cache" : " · newly indexed"}</span>`;
}

// ------------------------------------------------------------- sources ----
function scaleBar(sim) {
  // Scaled to the observed range (0.30-0.70), not 0-1 - see README /
  // BUILD_LOG: a 0-1 bar renders every real result as roughly half full
  // and communicates nothing.
  return Math.max(4, Math.min(100, (sim - 0.30) / 0.40 * 100));
}

function renderSources(hits) {
  const details = document.createElement("details");
  details.className = "sources";
  const summary = document.createElement("summary");
  summary.textContent = `Sources · ${hits.length} chunks retrieved`;
  details.appendChild(summary);

  const body = document.createElement("div");
  body.className = "sources-body";
  body.innerHTML = `<div class="caption">Retrieved by meaning, not keywords. Compare
    similarity values against each other, not against a fixed threshold — measured
    correct answers on the test document scored 0.49–0.64, while an <em>irrelevant</em>
    chunk scored 0.43.</div>`;

  hits.forEach((h, i) => {
    const rank = i + 1;
    const weak = rank === 1 ? "" : " weak";
    const row = document.createElement("div");
    row.className = "source-row";
    row.innerHTML =
      `<span class="chip${weak}">#${rank}</span>` +
      `<span class="chip${weak}">chunk ${h.chunk_index}</span>` +
      `<span class="chip${weak}">${h.similarity.toFixed(4)}</span>` +
      `<div class="bar"><div style="width:${scaleBar(h.similarity)}%"></div></div>` +
      `<p class="chunk-text">${h.text.slice(0, 900)}${h.text.length > 900 ? "…" : ""}</p>`;
    body.appendChild(row);
  });
  details.appendChild(body);
  return details;
}

// -------------------------------------------------------------- chat -----
function addMessage(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML =
    `<div class="avatar">${role === "user" ? ICONS.user : ICONS.spark}</div>` +
    `<div class="msg-body"><div class="bubble"></div></div>`;
  wrap.querySelector(".bubble").textContent = text;
  $("messages").appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
  return wrap;
}

async function handleUpload(file) {
  $("dropzone-text").innerHTML = `<span class="fname">${file.name}</span>`;
  $("status-text").textContent = "Indexing…";
  const form = new FormData();
  form.append("pdf", file);
  const r = await fetch("/api/upload", { method: "POST", body: form });
  const data = await r.json();
  if (!r.ok) {
    const warn = document.createElement("div");
    warn.className = "warn";
    warn.textContent = data.error || "Upload failed.";
    document.querySelector(".thread").insertBefore(warn, $("doc-bar"));
    shrug();
    say("That file didn't work — try another.");
    await refreshHealth();
    return;
  }
  state.collection = data.collection;
  state.filename = data.filename;
  state.chunkCount = data.chunks;
  state.wasCached = data.cached;
  state.messages = [];
  $("messages").innerHTML = "";
  $("empty-state").style.display = "none";
  renderDocBar();
  $("question").disabled = false;
  $("send").disabled = false;
  $("question").focus();
  jump();
  say(data.cached ? "Loaded this one before — ready to go." : "Loaded and ready.");
  await refreshHealth();
}

function botLoader(label) {
  // The "searching" indicator - a small floating robot with a head-turn,
  // scanning eyes and a pulsing antenna, all pure CSS (see the botHead /
  // botEyes / botPulse keyframes) - no 3D library, no image asset, so it
  // stays inline with the rest of the page's "one dependency-free file"
  // design. `label` differs by context: "Thinking…" for the grounded
  // answer, "Searching the web…" for the fallback, so it still reads as
  // status text, not just decoration.
  return `<div class="bot-loader">
    <div class="bot-3d">
      <div class="bot-antenna"><i class="bot-antenna-dot"></i></div>
      <div class="bot-head"><div class="bot-eye l"></div><div class="bot-eye r"></div></div>
      <div class="bot-shadow"></div>
    </div>
    <span class="bot-loader-text">${label}</span>
  </div>`;
}

function renderWebBlock(body) {
  // Built once, on "web_start", then filled in by later messages - see the
  // stream loop below. Kept visually distinct (teal, its own header saying
  // "not from your document") so it can never be mistaken for the grounded
  // answer above it, even mid-stream while the answer text is still empty.
  const block = document.createElement("div");
  block.className = "web-block";
  block.innerHTML =
    `<div class="web-header">${ICONS.globe}<span>Web fallback</span>` +
    `<span class="web-tag">— not from your document</span></div>` +
    `<div class="web-body"><div class="web-answer">${botLoader("Searching the web…")}</div>` +
    `<div class="web-sources"></div></div>`;
  body.appendChild(block);
  return block;
}

async function handleAsk(question) {
  addMessage("user", question);
  const assistantWrap = addMessage("assistant", "");
  const body = assistantWrap.querySelector(".msg-body");
  const bubble = assistantWrap.querySelector(".bubble");
  bubble.innerHTML = botLoader("Thinking…");

  // busy reset in `finally` below, not after each return - a stream can
  // end via the normal completion path, the !r.ok early return, or a
  // thrown exception, and the mascot must stop looking "alert" on all
  // three, not just the happy path.
  state.busy = true;
  updateMascot();
  try {
    await streamAnswer(question, body, bubble);
  } finally {
    state.busy = false;
    updateMascot();
  }
}

async function streamAnswer(question, body, bubble) {
  const r = await fetch("/api/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      question, collection: state.collection, web_fallback: state.webFallback,
    }),
  });

  if (!r.ok || !r.body) {
    bubble.textContent = "Request failed.";
    return;
  }

  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let full = "";
  let hits = null;
  let started = false;
  let webBlock = null, webAnswerEl = null, webFull = "", webStarted = false;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop(); // last partial line stays in the buffer
    for (const line of lines) {
      if (!line.trim()) continue;
      const msg = JSON.parse(line);

      if (msg.type === "hits") {
        hits = msg.hits;
      } else if (msg.type === "token") {
        if (!started) { bubble.textContent = ""; started = true; }
        full += msg.text;
        bubble.textContent = full;
        window.scrollTo(0, document.body.scrollHeight);

      } else if (msg.type === "error") {
        bubble.textContent = msg.message;

      } else if (msg.type === "web_start") {
        webBlock = renderWebBlock(body);
        webAnswerEl = webBlock.querySelector(".web-answer");

      } else if (msg.type === "web_results") {
        if (!msg.results.length) {
          webAnswerEl.textContent = "No web results found.";
        } else {
          const src = webBlock.querySelector(".web-sources");
          msg.results.forEach((res, i) => {
            const a = document.createElement("a");
            a.href = res.link; a.target = "_blank"; a.rel = "noopener noreferrer";
            a.className = "web-source-link";
            a.innerHTML = `<b>[${i + 1}]</b> ${res.title}`;
            src.appendChild(a);
          });
        }

      } else if (msg.type === "web_token") {
        if (!webStarted) { webAnswerEl.textContent = ""; webStarted = true; }
        webFull += msg.text;
        webAnswerEl.textContent = webFull;
        window.scrollTo(0, document.body.scrollHeight);

      } else if (msg.type === "web_error") {
        if (!webBlock) { webBlock = renderWebBlock(body); webAnswerEl = webBlock.querySelector(".web-answer"); }
        const note = document.createElement("div");
        note.className = "web-note";
        note.textContent = msg.message;
        webAnswerEl.replaceWith(note);
      }
    }
  }

  if (hits) body.appendChild(renderSources(hits));

  // React to the OUTCOME, not just "a response arrived" - `started` is
  // only true if real answer tokens streamed (excludes the fatal "error"
  // message path, which sets bubble text directly and never sets it).
  // looksLikeRefusal mirrors generate.py's own check, so this agrees with
  // what the server considers a refusal rather than guessing separately.
  if (started && full) {
    if (looksLikeRefusal(full)) { shrug(); say("That's not covered here."); }
    else { jump(); say("Found it."); }
  }
}

// ------------------------------------------------------------ dropzone ----
const dropzone = $("dropzone");
["dragenter", "dragover"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); }));
["dragleave", "drop"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); }));
dropzone.addEventListener("drop", (e) => {
  const file = e.dataTransfer.files[0];
  if (file) handleUpload(file);
});

$("file").addEventListener("change", (e) => {
  if (e.target.files[0]) handleUpload(e.target.files[0]);
});

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("question");
  const q = input.value.trim();
  if (!q || !state.collection) return;
  input.value = "";
  handleAsk(q);
});

$("clear").addEventListener("click", () => {
  $("messages").innerHTML = "";
});

refreshHealth().then((online) => {
  setTimeout(() => {
    jump();
    say(online ? "Hi — upload a PDF to start." : "Hi — Ollama isn't running yet.");
  }, 500);
});
setInterval(refreshHealth, 30000);
</script>
